<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skinfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <div class="brand">
            <img src="cs2skins.jpg" alt="Skinfolio logo">
            <h1>Skinfolio</h1>
        </div>

        <p id="totalValueContainer" style="display:none">Total collection value <span id="totalValue">0</span> kr</p>
        <div class="header-actions">
            <button id="headerLoginBtn">Login</button>
            <button id="headerRegisterBtn">Register</button>
            <button id="headerLogoutBtn" style="display: none;">Sign out</button>
        </div>
    </header>

    <main>


        <section id="skinCollection">
            <h2>Your Skins</h2>
            <div id="unauthenticatedState" style="text-align: center; margin-top: 50px;">
                <p>You have to be <a href="#" id="textLoginLink"> logged in</a> to see your collection</p>
            </div>
            <div id="statusMessage" class="status-message" style="display: none;">Retrieving skin data...</div>
            <div id="skinsContainer" class="skins-container" style="display: none;"></div>
        </section>
    </main>

    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div id="loginModal" class="modal-content">
            <span class="close-btn" id="closeLogin">&times;</span>
            <h3>Login</h3>
            <div id="loginMessage" style="display: none; margin-bottom: 10px;"></div>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9em;">
                No account? <a href="#" id="switchToRegister">Register here</a>
            </p>
        </div>

        <div id="registerModal" class="modal-content" style="display: none;">
            <span class="close-btn" id="closeRegister">&times;</span>
            <h3>Register account</h3>
            <div id="registerMessage" style="display: none; margin-top: 10px;"></div>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Chose username">
                <input type="password" id="regPassword" placeholder="Chose password">
                <button type="submit">Register</button>
            </form>
            <p style="margin-top: 15px;" font-size: 0.9em;>
                Already have an account <a href="#" id="switchToLogin">Login here</a>
            </p>
        </div>

        <div id="addSkinModal" class="modal-content" style="display: none;">
            <span class="close-btn" id="closeAddSkin">&times;</span>
            <h3>Add skin</h3>
            <div id="addSkinMessage" style="display: none; margin-top: 10px;"></div>
            <form id="addSkinForm">
                <input type="text" id="addSkinName" placeholder="Skin Name" required>
                <input type="text" id="addSkinPrice" placeholder="price" required>
                <input type="url" id="addSkinImage" placeholder="Image URL (optional)">

                <label>Category:</label>
                <select id="addSkinCategory" required>
                    <option value="1">Sniper</option>
                    <option value="2">Rifle</option>
                    <option value="3">Pistol</option>
                </select>
                <label>Wear:</label>
                <select id="addSkinCondition" required>¨
                    <option value="5">Battle-Scared</option>
                    <option value="4">Well-Worn</option>
                    <option value="3">Field-tested</option>
                    <option value="2">Mininal Wear</option>
                    <option value="1">Factory New</option>
                </select>
                <button type="submit" style="margin-top: 10px;">Add</button>
            </form>
        </div>


        <div id="editSkinModal"
            style="display: none; background: #2a2a2a; padding: 25px; border-radius: 8px; width: 300px; color: white; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">

            <span id="closeEditModalBtn" style="position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 1.5em; font-weight: bold; color: #888;">&times;</span>

            <h2 style="margin-top: 0; text-align: center; margin-bottom: 20px;">Edit Skin</h2>

            <form id="editSkinForm" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="hidden" id="editSkinId">

                <div>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 5px; color: #ccc;">Name</label>
                    <input type="text" id="editSkinName"
                        style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box;"
                        required>
                </div>

                <div>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 5px; color: #ccc;">Price (kr)</label>
                    <input type="number" id="editSkinPrice"
                        style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box;"
                        required>
                </div>

                <div>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 5px; color: #ccc;">Category</label>
                    <select id="editSkinCategory" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white;" required>
                        <option value="1">Sniper</option>
                        <option value="2">Rifle</option>
                        <option value="3">Pistol</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 5px; color: #ccc;">Condition</label>
                    <select id="editSkinCondition" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white;" required>
                        <option value="5">Battle-Scared</option>
                        <option value="4">Well-Worn</option>
                        <option value="3">Field-tested</option>
                        <option value="2">Minimal Wear</option>
                        <option value="1">Factory New</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 5px; color: #ccc;">Image URL</label>
                    <input type="text" id="editSkinImage"
                        style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box;">
                </div>

                <button type="submit"
                    style="background: #3498db; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 1em; margin-top: 5px;">
                    Save Changes
                </button>
            </form>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
